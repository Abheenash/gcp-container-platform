name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: v0.74.0

jobs:
  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks (secrets)
        # Not gitleaks-action: it scans a commit RANGE (base^..head), and on a
        # repo's first push the base is the root commit, which has no parent —
        # git errors out and the job fails without scanning anything. Scanning
        # the tree directly works whatever the history looks like.
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --verbose --exit-code 1
  iac-scan:
    name: checkov + terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: checkov (reviewed baseline in .checkov.yaml)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          config_file: .checkov.yaml
      - uses: hashicorp/setup-terraform@v4
      - name: fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  unit-tests:
    name: pytest (fake client + real Firestore emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: pip install -r tests/requirements.txt -r app/requirements.txt

      # Google's own emulator, speaking the real gRPC protocol. Free, no project,
      # no credentials — the client library skips auth entirely when
      # FIRESTORE_EMULATOR_HOST is set, which is why the app needs no test-only
      # code path. Started with `docker run` rather than a `services:` block
      # because the image needs a command and service containers cannot set one.
      - name: start the Firestore emulator
        run: |
          docker run -d --name fs-emulator -p 8085:8085 google/cloud-sdk:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8085
          for _ in $(seq 1 60); do
            if docker logs fs-emulator 2>&1 | grep -q "Dev App Server is now running"; then
              echo "emulator is up"; exit 0
            fi
            sleep 2
          done
          echo "::error::the Firestore emulator never started"; docker logs fs-emulator; exit 1

      # REQUIRE_FIRESTORE=1 makes a missing emulator an error rather than six
      # quiet skips behind a green tick.
      - run: python -m pytest tests -q
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8085
          REQUIRE_FIRESTORE: "1"

      - if: always()
        run: docker rm -f fs-emulator || true

  image-scan:
    name: trivy (image + deps) + SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: build image
        run: docker build -t gcp:ci .
      # Pinned, not @main — trivy's supply chain was compromised twice in March
      # 2026 (CVE-2026-33634). The malicious releases were v0.69.4/.5/.6;
      # v0.74.0 is well past remediation.
      - name: install trivy (pinned)
        run: |
          curl -sfL "https://raw.githubusercontent.com/aquasecurity/trivy/${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
          trivy --version
      - name: trivy image + dependency scan (HIGH/CRITICAL, fixed only)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --format table gcp:ci
      - name: trivy secret scan of the image layers
        run: trivy image --scanners secret --exit-code 1 --format table gcp:ci
      - name: generate SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json gcp:ci
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json
      - name: image must run as non-root
        run: |
          uid=$(docker run --rm --entrypoint id gcp:ci -u)
          test "$uid" = "10001" || { echo "container runs as uid $uid, expected 10001"; exit 1; }

  deploy:
    name: push to Artifact Registry + deploy (main only)
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    needs: [secrets-scan, iac-scan, unit-tests, image-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC -> GCP workload identity federation, and Sigstore
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # Keyless: GitHub's OIDC token is exchanged for a short-lived GCP token via
      # the workload identity pool in terraform/identity.tf. No service account
      # JSON key exists — which matters more on GCP than elsewhere, because an SA
      # key is a long-lived bearer credential with no expiry.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: build and push
        id: push
        env:
          REGISTRY: ${{ vars.ARTIFACT_REGISTRY }}
        run: |
          gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
          IMAGE="$REGISTRY/app:${GITHUB_SHA::12}"
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          DIGEST_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST_REF" >> "$GITHUB_OUTPUT"
          echo "digest_only=${DIGEST_REF#*@}" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@v3
      - name: sign the image by digest (keyless)
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"

      - name: attest build provenance (SLSA, in-toto)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.ARTIFACT_REGISTRY }}/app
          subject-digest: ${{ steps.push.outputs.digest_only }}
          push-to-registry: true

      - name: deploy the new revision
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE }}" \
            --image "${{ steps.push.outputs.image }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format 'value(status.url)'

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
      - name: tflint
        working-directory: ${{ github.workspace }}
        # GITHUB_TOKEN is not optional here. `tflint --init` downloads the ruleset
        # plugins from the GitHub releases API, and unauthenticated that call shares
        # a rate limit with every other runner on the same egress IP -- so it works
        # until the day the account is busy, then fails with "403 API rate limit
        # exceeded" having linted nothing. That is exactly how it broke: merging a
        # batch of dependency PRs ran enough CI to exhaust it. The token is issued
        # to every workflow run automatically and needs no setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tflint --init --config="${{ github.workspace }}/.tflint.hcl"
          tflint --chdir=terraform --config="${{ github.workspace }}/.tflint.hcl"

  # `terraform test` against a mocked provider: no cloud account, no cost, and it
  # asserts the specific promises this repo's README makes — which a generic
  # scanner cannot know.
  terraform-test:
    name: terraform test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_wrapper: false }
      - name: terraform test
        working-directory: ${{ github.workspace }}/terraform
        run: |
          terraform init -backend=false
          terraform test

  # Lint, including bandit's security rules. Every exclusion in ruff.toml carries
  # the reason it is there — a silent exclusion is indistinguishable from a bug
  # nobody noticed.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.16.8
          args: check --output-format github

  # GitHub's semantic analysis, free on public repos, reporting into the Security
  # tab. It reads data flow across files, which neither ruff nor checkov does.
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4

  # Blocks a PR that introduces a dependency with a known vulnerability or a
  # licence that does not fit. Renovate keeps things current; this stops a bad
  # one arriving in the first place.
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Requires "Dependency graph" enabled in repo settings, which a workflow
    # cannot turn on for itself. Non-blocking so a repo without it reports the
    # gap instead of failing every PR.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
